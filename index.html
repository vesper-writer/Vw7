<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120c09">
<title>VESPER</title>
<style>
*{box-sizing:border-box}html{background:#120c09;scroll-behavior:smooth}
body{margin:0;background:#120c09;color:#e6d9cb;min-height:100vh;font-family:Tahoma,"Arial",sans-serif;font-weight:300}
button,a{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{text-decoration:none}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 45%,rgba(166,101,53,.075),transparent 22%),radial-gradient(circle at 50% 72%,rgba(100,38,29,.04),transparent 32%);filter:blur(22px)}
#loading{position:fixed;inset:0;z-index:99;background:#120c09;display:grid;place-items:center;transition:.8s}
#loading.hide{opacity:0;visibility:hidden}
#loading span,.logo,.title,.drawer a,.drawer button,.page-title,.share,.comments-title,.article-nav a{font-family:Arial,sans-serif;font-weight:300;direction:ltr}
#loading span{font-size:20px;letter-spacing:.42em}
header{position:fixed;z-index:20;top:0;left:0;right:0;height:68px;padding:0 21px;display:flex;align-items:center;justify-content:space-between}
.v{font:300 18px Arial;letter-spacing:.1em}
.menu-button{width:30px;height:30px;padding:4px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.menu-button i{display:block;width:19px;height:1px;background:#b2a095}
.drawer{position:fixed;z-index:80;inset:0;background:#120c09;transform:translateY(-101%);transition:transform .5s ease;display:flex;align-items:center;justify-content:center}
.drawer.open{transform:none}.drawer-close{position:absolute;right:18px;top:14px;font:300 30px Arial;color:#75685f}
.drawer nav{display:flex;flex-direction:column;align-items:center;gap:31px}
.drawer a,.drawer button{font-size:13px;letter-spacing:.24em}.drawer button{padding:0}
main{width:min(100%,720px);margin:auto}
.page{padding:116px 25px 82px;animation:in .55s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.home{height:100svh;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{font-size:39px;letter-spacing:.34em;margin-left:.34em}
.home-links{display:flex;flex-direction:column;align-items:center;gap:23px;margin-top:54px}
.home-links a{font:300 12px Arial;letter-spacing:.25em}
.kicker{font:300 10px Arial;letter-spacing:.25em;color:#75685f;direction:ltr;margin-bottom:15px}
.page-title{font-size:23px;letter-spacing:.17em;margin:0 0 54px}
.read-list{display:flex;flex-direction:column;gap:112px}.read-item{display:block}
.rule{width:24px;height:1px;background:rgba(230,217,203,.12);margin-bottom:28px;transition:.35s}.read-item:hover .rule{width:42px}
.read-item h2{font-size:22px;font-weight:300;line-height:1.7;margin:0 0 8px}.date{font:300 10px Arial;color:#75685f;direction:ltr;text-align:right;letter-spacing:.04em;margin-bottom:22px}.excerpt{font-size:14px;line-height:2.35;color:#bdb0a5;margin:0}
.archive{display:flex;flex-direction:column}.archive-row{display:flex;align-items:baseline;gap:18px;padding:20px 0;border-bottom:1px solid rgba(230,217,203,.1)}.archive-no{width:28px;font:300 10px monospace;color:#75685f;direction:ltr}.archive-name{flex:1;font-size:15px;line-height:1.8}.archive-row .date{margin:0;font-size:9px}
.about{font-size:15px;line-height:2.55;color:#cbbdb1;white-space:pre-line;max-width:610px}.about:before{content:"";display:block;width:25px;height:1px;background:rgba(230,217,203,.12);margin-bottom:30px}
.back{display:inline-block;font:300 10px Arial;letter-spacing:.08em;color:#75685f;direction:ltr;margin-bottom:58px}.article h1{font-size:27px;font-weight:300;line-height:1.7;margin:0 0 7px}.article .date{margin-bottom:62px}
.article-body{font-size:16px;line-height:2.65;color:#d8cbc0}.article-body p{margin:0 0 2.15em}
.article-bottom{margin-top:82px;border-top:1px solid rgba(230,217,203,.1);padding-top:25px}.share{font-size:10px;letter-spacing:.18em;color:#75685f}.heart{display:block;font-size:24px;color:#b8a79a;margin:28px 0}
.comments{margin-top:61px}.comments-title{font-size:10px;letter-spacing:.2em;color:#75685f;margin-bottom:23px}.comment-form{display:flex;flex-direction:column;gap:9px}.comment-form input,.comment-form textarea{width:100%;background:transparent;border:1px solid rgba(230,217,203,.1);color:#e6d9cb;padding:12px;outline:0;font:300 13px Tahoma}.comment-form textarea{min-height:100px;resize:vertical}.comment-form button{align-self:flex-start;border:1px solid rgba(230,217,203,.1);padding:9px 16px;font:300 10px Arial;letter-spacing:.15em}
.comment{padding:20px 0;border-bottom:1px solid rgba(230,217,203,.1)}.comment-name{font-size:12px;margin-bottom:5px}.comment-text{font-size:13px;line-height:2;color:#aa9c91}
.article-nav{display:flex;justify-content:space-between;direction:ltr;margin-top:68px}.article-nav a{font-size:10px;letter-spacing:.08em;color:#75685f}
.search-box{display:flex;align-items:center;border-bottom:1px solid rgba(230,217,203,.1);margin-bottom:52px}.search-box input{flex:1;background:transparent;border:0;outline:0;color:#e6d9cb;padding:12px 0;font:300 14px Tahoma}.search-icon{font-size:16px;color:#75685f}.search-results{display:flex;flex-direction:column;gap:72px}
.not-found{min-height:70svh;display:grid;place-items:center;text-align:center}.not-found strong{font:300 60px Arial}.not-found p{font-size:13px;color:#75685f;margin:14px 0 27px}.not-found a{font:300 10px Arial;letter-spacing:.16em;direction:ltr}
@media(max-width:380px){.logo{font-size:33px}.page{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div id="loading"><span>VESPER</span></div>
<header><a class="v" href="#/">V</a><button class="menu-button" id="open" aria-label="Menu"><i></i><i></i></button></header>
<div class="drawer" id="drawer"><button class="drawer-close" id="close">×</button><nav>
<a href="#/">VESPER</a><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a><button id="search">SEARCH</button>
</nav></div>
<main id="app"></main>
<script>
(function(){
"use strict";
var writings=[
{id:"street",title:"خیابانی که از یادم نرفت",date:"08 September 2026",text:"بعضی خیابان‌ها فقط راهی برای رسیدن به جایی نیستند.\\nگاهی تمام چیزی که از یک زمان باقی می‌ماند، چند متر آسفالت است و نوری که عصرها روی دیوارها می‌افتد.\\n\\nمن از آن خیابان هیچ خاطره‌ی بزرگی ندارم.\\nنه اتفاقی در آن افتاد که بتوان نامش را داستان گذاشت، نه کسی آنجا خداحافظی کرد.\\n\\nفقط یک‌بار از آنجا گذشتم و بعد، عجیب بود که هر وقت به آن روز فکر می‌کردم، خیابان زودتر از آدم‌ها به یادم می‌آمد."},
{id:"letter",title:"نامه‌ای که قرار نبود خوانده شود",date:"02 September 2026",text:"این نامه را برای فرستادن ننوشتم.\\nشاید برای همین توانستم چیزهایی را بنویسم که در گفتنشان همیشه مکث کرده بودم.\\n\\nبعضی جمله‌ها وقتی مخاطبی ندارند، صادق‌تر می‌شوند.\\nدیگر لازم نیست توضیح بدهی چرا گفتی، چرا نماندی، یا چرا بعضی چیزها را هیچ‌وقت نگفتی.\\n\\nنامه همین‌جا تمام می‌شود.\\nنه چون حرفی نمانده؛\\nچون بعضی حرف‌ها بهتر است همان‌جایی بمانند که برای اولین بار نوشته شدند."}
];
var app=document.getElementById("app"),drawer=document.getElementById("drawer");
function esc(s){return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function excerpt(s){return esc(s.length>185?s.slice(0,185)+"…":s)}
function shell(x){app.innerHTML='<section class="page">'+x+'</section>'}
function home(){shell('<div class="home"><div class="logo">VESPER</div><nav class="home-links"><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a></nav></div>')}
function card(w){return '<a class="read-item" href="#/writing/'+w.id+'"><div class="rule"></div><h2>'+esc(w.title)+'</h2><div class="date">'+w.date+'</div><p class="excerpt">'+excerpt(w.text)+'</p></a>'}
function read(){var x='<div class="kicker">VESPER / WRITINGS</div><h1 class="page-title">READ</h1><div class="read-list">';writings.forEach(function(w){x+=card(w)});shell(x+'</div>')}
function archive(){var x='<div class="kicker">ALL WRITINGS</div><h1 class="page-title">ARCHIVE</h1><div class="archive">';writings.forEach(function(w,i){x+='<a class="archive-row" href="#/writing/'+w.id+'"><span class="archive-no">'+String(writings.length-i).padStart(3,"0")+'</span><span class="archive-name">'+esc(w.title)+'</span><span class="date">'+w.date+'</span></a>'});shell(x+'</div>')}
function about(){shell('<div class="kicker">THE WORLD OF VESPER</div><h1 class="page-title">ABOUT</h1><div class="about">Vesper از همین‌جا پدید آمد؛\\nاز میان کلماتی که گفته نشدند،\\nفکرهایی که جایی برای ماندن نداشتند،\\nو قصه‌هایی که گاهی از واقعیت آغاز شدند\\nو گاهی تنها در ذهن اتفاق افتادند.\\n\\nاینجا قرار نیست بدانید چه کسی نوشته است.\\nقرار نیست برای هر جمله، صاحب یا گذشته‌ای پیدا کنید.\\n\\nبعضی کلمات فقط باید خوانده شوند؛\\nبی‌آنکه لازم باشد بدانیم از کجا آمده‌اند.</div>')}
function article(id){var i=writings.findIndex(function(w){return w.id===id});if(i<0)return missing();var w=writings[i],prev=writings[i-1],next=writings[i+1];var body=w.text.split("\\n\\n").map(function(p){return "<p>"+esc(p)+"</p>"}).join("");shell('<article class="article"><a class="back" href="#/">← VESPER</a><h1>'+esc(w.title)+'</h1><div class="date">'+w.date+'</div><div class="article-body">'+body+'</div><div class="article-bottom"><button class="heart" aria-label="React">♡</button><button class="share" id="share">SHARE</button><section class="comments"><div class="comments-title">COMMENTS</div><form class="comment-form" id="form"><input id="name" maxlength="40" placeholder="Name (optional)"><textarea id="body" maxlength="800" placeholder="Write a comment…" required></textarea><button>POST</button></form><div id="comments"></div></section><nav class="article-nav">'+(prev?'<a href="#/writing/'+prev.id+'">← PREVIOUS</a>':'<span></span>')+(next?'<a href="#/writing/'+next.id+'">NEXT →</a>':'<span></span>')+'</nav></div></article>');
document.getElementById("share").onclick=function(){if(navigator.share){navigator.share({title:w.title,url:location.href}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){document.getElementById("share").textContent="COPIED"})}};
document.getElementById("form").onsubmit=function(e){e.preventDefault();var k="vesper-comments-"+id,a=JSON.parse(localStorage.getItem(k)||"[]");a.push({name:document.getElementById("name").value.trim()||"Anonymous",text:document.getElementById("body").value.trim()});localStorage.setItem(k,JSON.stringify(a));e.target.reset();renderComments(k)};
renderComments("vesper-comments-"+id)}
function renderComments(k){var el=document.getElementById("comments");if(!el)return;var a=JSON.parse(localStorage.getItem(k)||"[]");el.innerHTML=a.map(function(c){return '<div class="comment"><div class="comment-name">'+esc(c.name)+'</div><div class="comment-text">'+esc(c.text)+'</div></div>'}).join("")}
function searchPage(){shell('<div class="kicker">FIND A WORD</div><h1 class="page-title">SEARCH</h1><div class="search-box"><span class="search-icon">⌕</span><input id="query" placeholder="Search writings…"></div><div id="results" class="search-results"></div>');var q=document.getElementById("query"),r=document.getElementById("results");q.oninput=function(){var s=q.value.trim().toLowerCase();if(!s){r.innerHTML="";return}var found=writings.filter(function(w){return (w.title+" "+w.text).toLowerCase().indexOf(s)>-1});r.innerHTML=found.length?found.map(card).join(""):'<p class="excerpt">اینجا چیزی برای پیدا کردن نیست.</p>'};q.focus()}
function missing(){shell('<div class="not-found"><div><strong>404</strong><p>این صفحه دیگر اینجا نیست.</p><a href="#/">BACK TO VESPER</a></div></div>')}
function route(){var h=location.hash.replace(/^#/,"")||"/";if(h==="/")home();else if(h==="/read")read();else if(h==="/archive")archive();else if(h==="/about")about();else if(h==="/search")searchPage();else if(h.indexOf("/writing/")===0)article(h.split("/")[2]);else missing();window.scrollTo(0,0);drawer.classList.remove("open")}
document.getElementById("open").onclick=function(){drawer.classList.add("open")};document.getElementById("close").onclick=function(){drawer.classList.remove("open")};document.getElementById("search").onclick=function(){drawer.classList.remove("open");location.hash="/search"};window.addEventListener("hashchange",route);window.addEventListener("load",function(){route();setTimeout(function(){document.getElementById("loading").classList.add("hide")},700)});
})();
</script>
</body>
</html>
