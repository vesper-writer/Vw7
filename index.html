<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120c09"><title>VESPER</title><style>*{box-sizing:border-box}html{background:#120c09}body{margin:0;background:#120c09;color:#e6d9cb;min-height:100vh;font-family:Tahoma,Arial,sans-serif;font-weight:300}button,a{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{text-decoration:none}input,textarea{user-select:text;width:100%;background:transparent;border:1px solid rgba(230,217,203,.14);color:#e6d9cb;padding:12px;outline:0;font:300 13px Tahoma}.article-body,.read-item,.archive-row,.about,.page-title,h1,h2,p{user-select:none}.article-body{font-size:16px;line-height:2.65;color:#d8cbc0}.article-body p{margin:0 0 2.15em}#loading{position:fixed;inset:0;z-index:99;background:#120c09;display:grid;place-items:center;transition:.8s}#loading.hide{opacity:0;visibility:hidden}#loading span,.logo,.drawer a,.drawer button,.page-title,.share,.comments-title,.article-nav a,.admin-title{font-family:Arial,sans-serif;font-weight:300;direction:ltr}#loading span{font-size:20px;letter-spacing:.42em}header{position:fixed;z-index:20;top:0;left:0;right:0;height:68px;padding:0 21px;display:flex;align-items:center;justify-content:space-between}.v{font:300 18px Arial;letter-spacing:.1em}.menu-button{width:30px;height:30px;padding:4px;display:flex;flex-direction:column;justify-content:center;gap:6px}.menu-button i{display:block;width:19px;height:1px;background:#b2a095}.drawer{position:fixed;z-index:80;inset:0;background:#120c09;transform:translateY(-101%);transition:transform .5s ease;display:flex;align-items:center;justify-content:center}.drawer.open{transform:none}.drawer-close{position:absolute;right:18px;top:14px;font:300 30px Arial;color:#75685f}.drawer nav{display:flex;flex-direction:column;align-items:center;gap:31px}.drawer a,.drawer button{font-size:13px;letter-spacing:.24em}.drawer button{padding:0}main{width:min(100%,720px);margin:auto}.page{padding:116px 25px 82px;animation:in .55s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.home{height:100svh;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center}.logo{font-size:39px;letter-spacing:.34em;margin-left:.34em}.home-links{display:flex;flex-direction:column;align-items:center;gap:23px;margin-top:54px}.home-links a{font:300 12px Arial;letter-spacing:.25em}.kicker{font:300 10px Arial;letter-spacing:.25em;color:#75685f;direction:ltr;margin-bottom:15px}.page-title{font-size:23px;letter-spacing:.17em;margin:0 0 54px}.read-list{display:flex;flex-direction:column;gap:112px}.read-item{display:block}.rule{width:24px;height:1px;background:rgba(230,217,203,.12);margin-bottom:28px}.read-item h2{font-size:22px;font-weight:300;line-height:1.7;margin:0 0 8px}.date{font:300 10px Arial;color:#75685f;direction:ltr;text-align:right;letter-spacing:.04em;margin-bottom:22px}.excerpt{font-size:14px;line-height:2.35;color:#bdb0a5;margin:0}.archive{display:flex;flex-direction:column}.archive-row{display:flex;align-items:baseline;gap:18px;padding:20px 0;border-bottom:1px solid rgba(230,217,203,.1)}.archive-no{width:28px;font:300 10px monospace;color:#75685f;direction:ltr}.archive-name{flex:1;font-size:15px;line-height:1.8}.archive-row .date{margin:0;font-size:9px}.about{font-size:15px;line-height:2.55;color:#cbbdb1;white-space:pre-line;max-width:610px}.about:before{content:"";display:block;width:25px;height:1px;background:rgba(230,217,203,.12);margin-bottom:30px}.back{display:inline-block;font:300 10px Arial;letter-spacing:.08em;color:#75685f;direction:ltr;margin-bottom:58px}.article h1{font-size:27px;font-weight:300;line-height:1.7;margin:0 0 7px}.article .date{margin-bottom:62px}.article-bottom{margin-top:82px;border-top:1px solid rgba(230,217,203,.1);padding-top:25px}.share{font-size:10px;letter-spacing:.18em;color:#75685f}.heart{display:block;font-size:24px;color:#b8a79a;margin:28px 0}.comments{margin-top:61px}.comments-title{font-size:10px;letter-spacing:.2em;color:#75685f;margin-bottom:23px}.comment-form{display:flex;flex-direction:column;gap:9px}.comment-form textarea{min-height:100px;resize:vertical}.comment-form button,.admin-form button,.admin-action{align-self:flex-start;border:1px solid rgba(230,217,203,.14);padding:9px 16px;font:300 10px Arial;letter-spacing:.15em}.comment{padding:20px 0;border-bottom:1px solid rgba(230,217,203,.1)}.comment-name{font-size:12px;margin-bottom:5px}.comment-text{font-size:13px;line-height:2;color:#aa9c91}.article-nav{display:flex;justify-content:space-between;direction:ltr;margin-top:68px}.article-nav a{font-size:10px;letter-spacing:.08em;color:#75685f}.search-box{display:flex;align-items:center;border-bottom:1px solid rgba(230,217,203,.1);margin-bottom:52px}.search-box input{border:0;padding:12px 0}.search-results{display:flex;flex-direction:column;gap:72px}.not-found{min-height:70svh;display:grid;place-items:center;text-align:center}.not-found strong{font:300 60px Arial}.not-found p{font-size:13px;color:#75685f;margin:14px 0 27px}.not-found a{font:300 10px Arial;letter-spacing:.16em}.admin-login{max-width:430px;margin:80px auto 0;text-align:center}.admin-title{font-size:25px;letter-spacing:.2em;margin-bottom:14px}.admin-sub{font-size:13px;color:#75685f;margin-bottom:32px}.admin-form{display:flex;flex-direction:column;gap:10px;text-align:right}.admin-form button{margin-top:5px}.admin-error{color:#a97868;font-size:12px;min-height:18px}.admin-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:45px}.admin-card{border:1px solid rgba(230,217,203,.1);padding:22px;margin-bottom:16px}.admin-card h3{font-size:17px;font-weight:300;margin:0 0 8px}.admin-card p{font-size:12px;line-height:2;color:#9e9187;margin:0 0 17px}.admin-actions{display:flex;gap:9px;flex-wrap:wrap}.danger{color:#a97868}.admin-note{font-size:11px;color:#75685f;line-height:2.1;margin-top:30px}.admin-empty{color:#75685f;font-size:13px}.comment-admin{border-top:1px solid rgba(230,217,203,.1);margin-top:45px;padding-top:30px}.comment-admin .comment{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.comment-admin .comment-info{flex:1}.status{font-size:10px;color:#75685f;margin-top:7px}@media(max-width:380px){.logo{font-size:33px}.page{padding-left:20px;padding-right:20px}}</style></head><body><div id="loading"><span>VESPER</span></div><header><a class="v" href="#/">V</a><button class="menu-button" id="open" aria-label="Menu"><i></i><i></i></button></header><div class="drawer" id="drawer"><button class="drawer-close" id="close">×</button><nav><a href="#/">VESPER</a><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a><button id="search">SEARCH</button><a href="#/admin">ADMIN</a></nav></div><main id="app"></main><script>(function(){'use strict';
const SB_URL='https://pmudwltxmyljiiiossch.supabase.co';
const SB_KEY='sb_publishable_As2-YSQgc3BRsv1MzTdKDg_qUz3nqQ8';
const ADMIN_KEY='vesper-admin-password';
const headers={'apikey':SB_KEY,'Content-Type':'application/json'};
async function sb(path,opts={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{...headers,...(opts.headers||{})}});if(!r.ok){let e=await r.text();throw new Error(e||'Request failed')}return r.status===204?null:r.json()}
async function rpc(name,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}
let writings=[];let adminData=null;const app=document.getElementById('app'),drawer=document.getElementById('drawer');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(x){app.innerHTML='<section class="page">'+x+'</section>'}
function card(w){return '<a class="read-item" href="#/writing/'+encodeURIComponent(w.id)+'"><div class="rule"></div><h2>'+esc(w.title)+'</h2><div class="date">'+esc(w.date)+'</div><p class="excerpt">'+esc(w.text.slice(0,185))+(w.text.length>185?'…':'')+'</p></a>'}
async function loadWritings(){writings=await sb('writings?select=*&order=created_at.desc')}
function home(){shell('<div class="home"><div class="logo">VESPER</div><nav class="home-links"><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a></nav></div>')}
async function read(){shell('<div class="kicker">VESPER / WRITINGS</div><h1 class="page-title">READ</h1><div id="readlist">Loading…</div>');try{await loadWritings();document.getElementById('readlist').outerHTML='<div class="read-list">'+writings.map(card).join('')+'</div>'}catch(e){document.getElementById('readlist').textContent='Unable to load writings.'}}
async function archive(){shell('<div class="kicker">ALL WRITINGS</div><h1 class="page-title">ARCHIVE</h1><div id="archive">Loading…</div>');try{await loadWritings();document.getElementById('archive').outerHTML='<div class="archive">'+writings.map((w,i)=>'<a class="archive-row" href="#/writing/'+encodeURIComponent(w.id)+'"><span class="archive-no">'+String(writings.length-i).padStart(3,'0')+'</span><span class="archive-name">'+esc(w.title)+'</span><span class="date">'+esc(w.date)+'</span></a>').join('')+'</div>'}catch(e){document.getElementById('archive').textContent='Unable to load writings.'}}
function about(){shell('<div class="kicker">THE WORLD OF VESPER</div><h1 class="page-title">ABOUT</h1><div class="about">Vesper از همین‌جا پدید آمد؛\nاز میان کلماتی که گفته نشدند،\nفکرهایی که جایی برای ماندن نداشتند،\nو قصه‌هایی که گاهی از واقعیت آغاز شدند\nو گاهی تنها در ذهن اتفاق افتادند.\n\nاینجا قرار نیست بدانید چه کسی نوشته است.\nقرار نیست برای هر جمله، صاحب یا گذشته‌ای پیدا کنید.\n\nبعضی کلمات فقط باید خوانده شوند؛\nبی‌آنکه لازم باشد بدانیم از کجا آمده‌اند.</div>')}
async function article(id){await loadWritings();const w=writings.find(x=>x.id===decodeURIComponent(id));if(!w)return missing();const body=w.text.split('\n\n').map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');shell('<article class="article"><a class="back" href="#/">← VESPER</a><h1>'+esc(w.title)+'</h1><div class="date">'+esc(w.date)+'</div><div class="article-body">'+body+'</div><div class="article-bottom"><button class="heart">♡</button><button class="share" id="share">SHARE</button><section class="comments"><div class="comments-title">COMMENTS</div><form class="comment-form" id="form"><input id="name" maxlength="40" placeholder="Name (optional)"><textarea id="body" maxlength="800" placeholder="Write a comment…" required></textarea><button>POST</button></form><div id="comments">Loading…</div></section></div></article>');document.getElementById('share').onclick=()=>{if(navigator.share)navigator.share({title:w.title,url:location.href});else navigator.clipboard?.writeText(location.href)};document.getElementById('form').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('name').value.trim()||'Anonymous',body=document.getElementById('body').value.trim();if(!body)return;try{await sb('comments',{method:'POST',headers:{...headers,'Prefer':'return=minimal'},body:JSON.stringify({writing_id:w.id,name,body})});e.target.reset();renderComments(w.id)}catch(err){alert('ارسال نظر انجام نشد.')}};renderComments(w.id)}
async function renderComments(id){const el=document.getElementById('comments');if(!el)return;try{const a=await sb('comments?select=id,name,body,created_at&writing_id=eq.'+encodeURIComponent(id)+'&approved=eq.true&order=created_at.asc');el.innerHTML=a.length?a.map(c=>'<div class="comment"><div class="comment-name">'+esc(c.name)+'</div><div class="comment-text">'+esc(c.body)+'</div></div>').join(''):'<div class="admin-empty">No comments yet.</div>'}catch(e){el.textContent='Unable to load comments.'}}
function searchPage(){shell('<div class="kicker">FIND A WORD</div><h1 class="page-title">SEARCH</h1><div class="search-box"><span class="search-icon">⌕</span><input id="query" placeholder="Search writings…"></div><div id="results" class="search-results"></div>');const q=document.getElementById('query'),r=document.getElementById('results');q.oninput=()=>{const s=q.value.trim().toLowerCase();r.innerHTML=s?writings.filter(w=>(w.title+' '+w.text).toLowerCase().includes(s)).map(card).join(''):' ';};q.focus()}
function adminLogin(){shell('<div class="admin-login"><div class="kicker">PRIVATE AREA</div><h1 class="admin-title">ADMIN</h1><div class="admin-sub">VESPER MANAGEMENT</div><form class="admin-form" id="login"><input id="pass" type="password" placeholder="Password"><button>ENTER</button><div id="admin-error" class="admin-error"></div></form></div>');document.getElementById('login').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value;try{await rpc('admin_list',{p_password:p});sessionStorage.setItem(ADMIN_KEY,p);location.hash='/admin/panel'}catch(err){document.getElementById('admin-error').textContent='رمز عبور نادرست است.'}}}
async function adminPanel(){const p=sessionStorage.getItem(ADMIN_KEY);if(!p)return adminLogin();try{adminData=await rpc('admin_list',{p_password:p})}catch(e){sessionStorage.removeItem(ADMIN_KEY);return adminLogin()}const ws=adminData.writings||[],cs=adminData.comments||[];let x='<div class="kicker">VESPER MANAGEMENT</div><h1 class="admin-title">ADMIN</h1><div class="admin-tools"><button class="admin-action" id="new">+ NEW WRITING</button><button class="admin-action" id="logout">LOG OUT</button></div>';ws.forEach(w=>{x+='<div class="admin-card"><h3>'+esc(w.title)+'</h3><p>'+esc(w.date)+'</p><div class="admin-actions"><button class="admin-action" data-edit="'+esc(w.id)+'">EDIT</button><button class="admin-action danger" data-delete="'+esc(w.id)+'">DELETE</button></div></div>'});x+='<section class="comment-admin"><div class="comments-title">COMMENTS</div>'+(cs.length?cs.map(c=>'<div class="comment" data-comment="'+c.id+'"><div class="comment-info"><div class="comment-name">'+esc(c.name)+'</div><div class="comment-text">'+esc(c.body)+'</div><div class="status">'+(c.approved?'Published':'Hidden')+'</div></div><div class="admin-actions">'+(c.approved?'<button class="admin-action" data-hide="'+c.id+'">HIDE</button>':'<button class="admin-action" data-show="'+c.id+'">APPROVE</button>')+'<button class="admin-action danger" data-cdel="'+c.id+'">DELETE</button></div></div>').join(''):'<div class="admin-empty">No comments.</div>')+'</section>';shell(x);document.getElementById('new').onclick=()=>adminEditor(null);document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(ADMIN_KEY);location.hash='/admin'};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>adminEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('این نوشته حذف شود؟')){await rpc('admin_delete_writing',{p_password:p,p_id:b.dataset.delete});adminPanel()}});document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(confirm('این نظر حذف شود؟')){await rpc('admin_delete_comment',{p_password:p,p_id:Number(b.dataset.cdel)});adminPanel()}});document.querySelectorAll('[data-hide],[data-show]').forEach(b=>b.onclick=async()=>{await rpc('admin_set_comment_approval',{p_password:p,p_id:Number(b.dataset.hide||b.dataset.show),p_approved:b.hasAttribute('data-show')});adminPanel()})}
function adminEditor(id){const w=adminData.writings.find(a=>a.id===id);shell('<div class="kicker">VESPER / EDITOR</div><h1 class="admin-title">'+(w?'EDIT':'NEW')+'</h1><form class="admin-form" id="editor"><input id="etitle" placeholder="Title" value="'+(w?esc(w.title):'')+'"><input id="edate" placeholder="Date" value="'+(w?esc(w.date):'')+'"><textarea id="etext" placeholder="Writing...">'+(w?esc(w.text):'')+'</textarea><button>SAVE</button><button type="button" id="cancel">CANCEL</button></form>');document.getElementById('cancel').onclick=adminPanel;document.getElementById('editor').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('etitle').value.trim(),d=document.getElementById('edate').value.trim()||'VESPER',z=document.getElementById('etext').value.trim(),p=sessionStorage.getItem(ADMIN_KEY);if(!t||!z)return;await rpc('admin_save_writing',{p_password:p,p_id:w?w.id:'w'+Date.now(),p_title:t,p_date:d,p_text:z});adminPanel()}}
function missing(){shell('<div class="not-found"><div><strong>404</strong><p>این صفحه دیگر اینجا نیست.</p><a href="#/">BACK TO VESPER</a></div></div>')}
async function route(){const h=location.hash.replace(/^#/,'')||'/';try{if(h==='/')home();else if(h==='/read')await read();else if(h==='/archive')await archive();else if(h==='/about')about();else if(h==='/search'){await loadWritings();searchPage()}else if(h==='/admin')adminLogin();else if(h==='/admin/panel')await adminPanel();else if(h.indexOf('/writing/')===0)await article(h.substring(9));else missing()}catch(e){shell('<div class="not-found"><div><strong>!</strong><p>خطایی در بارگذاری رخ داد.</p></div></div>')}window.scrollTo(0,0);drawer.classList.remove('open')}
document.getElementById('open').onclick=()=>drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');document.getElementById('search').onclick=()=>{drawer.classList.remove('open');location.hash='/search'};window.addEventListener('hashchange',route);window.addEventListener('load',()=>{route();setTimeout(()=>document.getElementById('loading').classList.add('hide'),700)});
})();</script></body></html>
