<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0b0a"><title>VESPER</title>
<style>
body{margin:0;background:#0d0b0a;color:#e7ddd4;font-family:Tahoma,Arial,sans-serif}a,button{color:inherit}a{text-decoration:none}button{border:0;background:none;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;border:1px solid #2c2521;background:#11100f;color:#eee6df;padding:13px;font:300 14px Tahoma}textarea{min-height:170px;resize:vertical}.top{position:fixed;z-index:10;top:0;left:0;right:0;height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{font:300 17px Arial;letter-spacing:.35em}.menu{width:34px}.menu span,.menu span:before,.menu span:after{display:block;width:20px;height:1px;background:#9d9188;content:""}.menu span:before{transform:translateY(-6px)}.menu span:after{transform:translateY(5px)}.drawer{position:fixed;z-index:30;inset:0;background:#0d0b0a;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}.drawer.open{opacity:1;pointer-events:auto}.drawer nav{display:flex;flex-direction:column;align-items:center;gap:27px}.drawer a,.drawer button{font:300 12px Arial;letter-spacing:.22em}.close{position:absolute;top:16px;right:20px;font:300 30px Arial;color:#70645d}main{width:min(100%,760px);margin:auto}.page{padding:120px 26px 90px}.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}.logo{font:300 45px Arial;letter-spacing:.3em;margin-left:.3em}.tag{margin-top:19px;color:#786b63;font-size:11px}.links{display:flex;gap:28px;margin-top:52px;direction:ltr}.links a{font:300 11px Arial;letter-spacing:.2em;color:#b5a79d}.eyebrow,.title,.comments-title,.share{font-family:Arial;direction:ltr}.eyebrow{font-size:10px;letter-spacing:.25em;color:#766a62;margin-bottom:12px}.title{font-size:26px;font-weight:300;letter-spacing:.12em;margin:0 0 48px}.list{display:flex;flex-direction:column;gap:74px}.item{display:block}.line{width:28px;height:1px;background:#302924;margin-bottom:22px}.item h2{font-size:22px;line-height:1.8;font-weight:300;margin:0 0 4px}.date{font:300 10px Arial;color:#756a62;direction:ltr;letter-spacing:.05em;margin:0 0 18px}.excerpt{color:#b9aaa0;font-size:14px;line-height:2.35;margin:0}.archive-row{display:flex;gap:17px;align-items:baseline;padding:19px 0;border-bottom:1px solid #211c19}.num{font:300 10px Arial;color:#625952;width:28px}.archive-name{flex:1;font-size:15px}.about{max-width:620px;color:#cdbfb5;line-height:2.7;font-size:15px;white-space:pre-line}.about:before{content:"";display:block;width:28px;height:1px;background:#302924;margin-bottom:30px}.back{display:inline-block;font:300 10px Arial;letter-spacing:.12em;color:#766a62;margin-bottom:52px}.article h1{font-size:29px;font-weight:300;line-height:1.7;margin:0 0 5px}.article .date{margin-bottom:58px}.body{font-size:17px;line-height:2.65;color:#d7cbc2}.body p{margin:0 0 2em}.under{border-top:1px solid #25201d;margin-top:76px;padding-top:28px}.share{font-size:10px;letter-spacing:.18em;color:#756a62}.comments{margin-top:55px}.comments-title{font-size:10px;letter-spacing:.22em;color:#756a62;margin-bottom:22px}.comment-form,.admin-form{display:flex;flex-direction:column;gap:9px}.comment-form button,.action{border:1px solid #302924;padding:10px 16px;font:300 10px Arial;letter-spacing:.13em;align-self:flex-start}.comment{padding:18px 0;border-bottom:1px solid #211c19}.comment-name{font-size:12px;margin-bottom:6px}.comment-text{font-size:13px;color:#ad9f96;line-height:2}.muted,.empty{color:#675d57;font-size:12px}.admin-login{max-width:430px;margin:30px auto}.error{min-height:20px;color:#a97868;font-size:12px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}.card{border:1px solid #29231f;padding:20px;margin-bottom:12px}.card h3{font-weight:300;margin:0 0 8px;font-size:17px}.card p{font-size:11px;color:#71665f;margin:0 0 17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#b08070}.comment-admin{margin-top:45px;border-top:1px solid #29231f;padding-top:28px}.comment-admin .comment{display:flex;gap:15px;justify-content:space-between}.comment-info{flex:1}.status{font-size:10px;color:#70655e;margin-top:7px}.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 35px}.stat{border:1px solid #29231f;padding:17px}.stat b{display:block;font:300 25px Arial;margin-bottom:7px}.stat span{font-size:10px;color:#756a62}.analytics{border-top:1px solid #29231f;padding-top:28px;margin-bottom:45px}.bar-row{padding:12px 0;border-bottom:1px solid #211c19}.bar-head{display:flex;justify-content:space-between;gap:15px;font-size:12px}.bar-num{font:300 11px Arial;color:#9d9188}.mini{font-size:10px;color:#675d57;margin-top:5px}.editor{max-width:680px}.editor textarea{min-height:360px}.editor-tools{display:flex;gap:9px;margin-top:10px}@media(max-width:600px){.logo{font-size:37px}.links{gap:18px}.body{font-size:16px}.page{padding-left:21px;padding-right:21px}.dashboard{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/">V</a><button class="menu" id="menu"><span></span></button></header>
<div class="drawer" id="drawer"><button class="close" id="close">×</button><nav><a href="#/">VESPER</a><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a><button id="searchBtn">SEARCH</button><a href="#/admin">ADMIN</a></nav></div>
<main id="app"></main>
<script>
const U='https://pmudwltxmyljiiiossch.supabase.co',K='sb_publishable_As2-YSQgc3BRsv1MzTdKDg_qUz3nqQ8',S='vesper-admin-session',H={apikey:K,'Content-Type':'application/json'};let writings=[],adminData=null,analytics=null;const app=document.getElementById('app'),drawer=document.getElementById('drawer');
async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function rpc(n,a){const r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:H,body:JSON.stringify(a)});if(!r.ok)throw Error(await r.text());return r.json()}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function page(x){app.innerHTML='<section class="page">'+x+'</section>';scrollTo(0,0)}async function load(){writings=await api('writings?select=*&order=created_at.desc')}function item(w){return '<a class="item" href="#/writing/'+encodeURIComponent(w.id)+'"><div class="line"></div><h2>'+esc(w.title)+'</h2><div class="date">'+esc(w.date)+'</div><p class="excerpt">'+esc((w.text||'').slice(0,190))+((w.text||'').length>190?'…':'')+'</p></a>'}function home(){page('<div class="hero"><div class="logo">VESPER</div><div class="tag">words that stayed</div><nav class="links"><a href="#/read">READ</a><a href="#/archive">ARCHIVE</a><a href="#/about">ABOUT</a></nav></div>')}async function read(){page('<div class="eyebrow">VESPER / WRITINGS</div><h1 class="title">READ</h1><div id="out" class="muted">Loading…</div>');try{await load();document.getElementById('out').outerHTML='<div class="list">'+writings.map(item).join('')+'</div>'}catch(e){document.getElementById('out').textContent='Unable to load writings.'}}async function archive(){page('<div class="eyebrow">ALL WRITINGS</div><h1 class="title">ARCHIVE</h1><div id="out" class="muted">Loading…</div>');try{await load();document.getElementById('out').outerHTML='<div>'+writings.map((w,i)=>'<a class="archive-row" href="#/writing/'+encodeURIComponent(w.id)+'"><span class="num">'+String(writings.length-i).padStart(3,'0')+'</span><span class="archive-name">'+esc(w.title)+'</span><span class="date">'+esc(w.date)+'</span></a>').join('')+'</div>'}catch(e){document.getElementById('out').textContent='Unable to load archive.'}}function about(){page('<div class="eyebrow">THE WORLD OF VESPER</div><h1 class="title">ABOUT</h1><div class="about">همه‌چیز از جایی می‌آید؛\nاز یک اتفاق، یک فکر، یک تصویر،\nیا چیزی که هرگز اتفاق نیفتاده است.\n\nاینجا مرزی میان واقعیت و خیال نیست.\nهر نوشته، فقط همان چیزی‌ست که روی صفحه مانده؛\nنه اعترافی، نه شرحی از یک زندگی.\n\nVesper از همین‌جا پدید آمد؛\nاز میان کلمات.</div>')}
async function article(id){await load();const w=writings.find(x=>x.id===decodeURIComponent(id));if(!w)return notFound();const b=(w.text||'').split(/\n\n+/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');page('<article class="article"><a class="back" href="#/">← VESPER</a><h1>'+esc(w.title)+'</h1><div class="date">'+esc(w.date)+'</div><div class="body">'+b+'</div><div class="under"><button class="share" id="share">SHARE</button><section class="comments"><div class="comments-title">COMMENTS</div><form class="comment-form" id="cf"><input id="name" maxlength="40" placeholder="Name"><textarea id="comment" maxlength="800" placeholder="Write a comment…" required></textarea><button>POST COMMENT</button></form><div id="comments" class="muted">Loading…</div></section></div></article>');document.getElementById('share').onclick=()=>navigator.share?navigator.share({title:w.title,url:location.href}):navigator.clipboard?.writeText(location.href);document.getElementById('cf').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('name').value.trim()||'Anonymous',body=document.getElementById('comment').value.trim();try{await api('comments',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({writing_id:w.id,name,body})});e.target.reset();alert('نظر ثبت شد و پس از تأیید نمایش داده می‌شود.')}catch(x){alert('ارسال نظر انجام نشد.')}};comments(w.id);recordView(w.id)}
async function recordView(id){try{const key='vesper-view-'+id;if(sessionStorage.getItem(key))return;await rpc('record_writing_view',{p_id:id});sessionStorage.setItem(key,'1')}catch(e){}}
async function comments(id){const e=document.getElementById('comments');try{const a=await api('comments?select=id,name,body,created_at&writing_id=eq.'+encodeURIComponent(id)+'&approved=eq.true&order=created_at.asc');e.innerHTML=a.length?a.map(c=>'<div class="comment"><div class="comment-name">'+esc(c.name)+'</div><div class="comment-text">'+esc(c.body)+'</div></div>').join(''):'<div class="empty">No comments yet.</div>'}catch(x){e.textContent='Unable to load comments.'}}
function search(){page('<div class="eyebrow">FIND A WORD</div><h1 class="title">SEARCH</h1><input id="q" placeholder="Search writings…"><div id="res" class="list"></div>');const q=document.getElementById('q'),r=document.getElementById('res');q.oninput=()=>{const s=q.value.trim().toLowerCase();r.innerHTML=s?writings.filter(w=>(w.title+' '+w.text).toLowerCase().includes(s)).map(item).join(''):' '};q.focus()}
function adminLogin(){page('<div class="admin-login"><div class="eyebrow">PRIVATE AREA</div><h1 class="title">ADMIN</h1><form class="admin-form" id="login"><input id="pass" type="password" placeholder="Password"><button class="action">ENTER</button><div class="error" id="err"></div></form></div>');document.getElementById('login').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value;try{await rpc('admin_list',{p_password:p});sessionStorage.setItem(S,p);location.hash='/admin/panel'}catch(x){document.getElementById('err').textContent='رمز عبور نادرست است.'}}}
async function adminPanel(){const p=sessionStorage.getItem(S);if(!p)return adminLogin();try{adminData=await rpc('admin_list',{p_password:p});analytics=await rpc('admin_analytics',{p_password:p})}catch(e){sessionStorage.removeItem(S);return adminLogin()}const ws=adminData.writings||[],cs=adminData.comments||[],by=analytics.by_writing||[];let h='<div class="eyebrow">VESPER MANAGEMENT</div><h1 class="title">ADMIN</h1>';h+='<div class="dashboard"><div class="stat"><b>'+ws.length+'</b><span>WRITINGS</span></div><div class="stat"><b>'+cs.length+'</b><span>COMMENTS</span></div><div class="stat"><b>'+cs.filter(c=>!c.approved).length+'</b><span>PENDING</span></div><div class="stat"><b>'+Number(analytics.total_views||0)+'</b><span>VIEWS</span></div></div>';h+='<div class="analytics"><div class="comments-title">ANALYTICS</div><div class="dashboard"><div class="stat"><b>'+Number(analytics.views_7d||0)+'</b><span>VIEWS / 7 DAYS</span></div><div class="stat"><b>'+Number(analytics.views_30d||0)+'</b><span>VIEWS / 30 DAYS</span></div></div>';h+=by.length?by.map(x=>'<div class="bar-row"><div class="bar-head"><span>'+esc(x.title)+'</span><span class="bar-num">'+Number(x.views||0)+' views</span></div><div class="mini">'+Number(x.comments||0)+' comments</div></div>').join(''):'<div class="empty">No analytics yet.</div>';h+='</div><div class="tools"><button class="action" id="new">+ NEW WRITING</button><button class="action" id="logout">LOG OUT</button></div>';h+=ws.length?ws.map(w=>'<div class="card"><h3>'+esc(w.title)+'</h3><p>'+esc(w.date)+'</p><div class="actions"><button class="action" data-edit="'+esc(w.id)+'">EDIT</button><button class="action danger" data-del="'+esc(w.id)+'">DELETE</button></div></div>').join(''):'<div class="empty">No writings yet.</div>';h+='<section class="comment-admin"><div class="comments-title">COMMENTS</div>'+(cs.length?cs.map(c=>'<div class="comment"><div class="comment-info"><div class="comment-name">'+esc(c.name)+'</div><div class="comment-text">'+esc(c.body)+'</div><div class="status">'+(c.approved?'Published':'Waiting for approval')+'</div></div><div class="actions">'+(c.approved?'<button class="action" data-hide="'+c.id+'">HIDE</button>':'<button class="action" data-show="'+c.id+'">APPROVE</button>')+'<button class="action danger" data-cdel="'+c.id+'">DELETE</button></div></div>').join(''):'<div class="empty">No comments.</div>')+'</section>';page(h);document.getElementById('new').onclick=()=>editor(null);document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(S);location.hash='/admin'};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('این نوشته حذف شود؟')){await rpc('admin_delete_writing',{p_password:p,p_id:b.dataset.del});adminPanel()}});document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{if(confirm('این نظر حذف شود؟')){await rpc('admin_delete_comment',{p_password:p,p_id:Number(b.dataset.cdel)});adminPanel()}});document.querySelectorAll('[data-show],[data-hide]').forEach(b=>b.onclick=async()=>{await rpc('admin_set_comment_approval',{p_password:p,p_id:Number(b.dataset.show||b.dataset.hide),p_approved:b.hasAttribute('data-show')});adminPanel()})}
function editor(id){const p=sessionStorage.getItem(S),w=(adminData.writings||[]).find(x=>x.id===id);page('<div class="editor"><div class="eyebrow">VESPER / EDITOR</div><h1 class="title">'+(w?'EDIT':'NEW')+'</h1><form class="admin-form" id="ef"><input id="et" maxlength="180" placeholder="Title" value="'+esc(w?.title||'')+'"><input id="ed" maxlength="80" placeholder="Date" value="'+esc(w?.date||new Date().toLocaleDateString('fa-IR'))+'"><textarea id="ex" placeholder="Write your text…">'+esc(w?.text||'')+'</textarea><div class="editor-tools"><button class="action">SAVE</button><button type="button" class="action" id="cancel">CANCEL</button></div><div class="error" id="ee"></div></form></div>');document.getElementById('cancel').onclick=()=>adminPanel();document.getElementById('ef').onsubmit=async e=>{e.preventDefault();try{await rpc('admin_save_writing',{p_password:p,p_id:id||null,p_title:document.getElementById('et').value.trim(),p_date:document.getElementById('ed').value.trim(),p_text:document.getElementById('ex').value});location.hash='/admin/panel'}catch(x){document.getElementById('ee').textContent='ذخیره انجام نشد.'}}}
function notFound(){page('<div class="eyebrow">VESPER</div><h1 class="title">NOT FOUND</h1>')}function route(){const h=location.hash.slice(1)||'/';if(h==='/')home();else if(h==='/read')read();else if(h==='/archive')archive();else if(h==='/about')about();else if(h==='/admin')adminLogin();else if(h==='/admin/panel')adminPanel();else if(h==='/search')search();else if(h.startsWith('/writing/'))article(h.slice(9));else notFound()}document.getElementById('menu').onclick=()=>drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');document.querySelectorAll('.drawer a').forEach(a=>a.onclick=()=>drawer.classList.remove('open'));document.getElementById('searchBtn').onclick=()=>{drawer.classList.remove('open');location.hash='/search'};addEventListener('hashchange',route);route();
</script>
</body></html>
